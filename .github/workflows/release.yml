name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
      - '*.*.*-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sheru-bohra/vms-backend
  FRONTEND_IMAGE: ghcr.io/sheru-bohra/vms-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: npm run install:all

      - name: Repository secret scan
        run: node scripts/repo-secret-scan.mjs

      - name: Backend tests
        run: npm run test:backend
        env:
          AUDIT_INTEGRITY_KEY: ci-test-audit-integrity-key-32chars-min
          DOCUMENT_ENCRYPTION_KEY: ci-test-document-encryption-key-32

      - name: Frontend tests
        run: npm run test:frontend
        env:
          VITE_AUTH_MODE: vms_native
          VITE_ENABLE_SOURCEMAPS: false

      - name: Page lock verification
        run: npm run page:verify

      - name: Frontend production build
        run: npm run build
        env:
          VITE_AUTH_MODE: vms_native
          VITE_ENABLE_SOURCEMAPS: false

      - name: Frontend bundle secret scan
        run: npm run frontend:secret-scan

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=1.0.0-rc1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=1.0.0-rc1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_AUTH_MODE=vms_native
            VITE_ENABLE_SOURCEMAPS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
